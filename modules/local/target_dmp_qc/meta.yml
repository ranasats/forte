name: target_dmp_qc
description: Generate a QC report from the Forte pipeline.
inputs:
  - name: target_dmp_qc_rmd
    type: path
    description: Path to the TARGET QC R markdown file.
  - name: sample_dirs
    type: path
    multiple: true
    description: List of paths to individal sample analysis directories.
outputs:
  - name: html_report
    type: path
    description: The rendered TARGET_QC_report.html file.
